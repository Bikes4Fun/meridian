name: Meridian
options:
  bundleIdPrefix: com.meridian
  deploymentTarget:
    iOS: "15.0"
targets:
  Meridian:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    preBuildScripts:
      - script: |
          cp "$SRCROOT/../assets/app-icon.png" "$SRCROOT/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
        name: Copy shared app icon
    sources:
      - path: .
        excludes:
          - "Package.swift"
          - "run_ios.sh"
          - "project.yml"
          - "README.md"
          - ".build"
          - ".swiftpm"
    settings:
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: "YES"
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "NO"
      INFOPLIST_KEY_UILaunchStoryboardName: ""
      INFOPLIST_KEY_UIStatusBarHidden: "NO"
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "When you tap Check In, Meridian records your current location and shares it with your family circle so they can see where you are. Location is only used at check-in time, not continuously."
      INFOPLIST_KEY_UIBackgroundModes: remote-notification
      PRODUCT_BUNDLE_IDENTIFIER: com.meridian.Meridian
      CODE_SIGN_ENTITLEMENTS: Meridian.entitlements
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: NO
