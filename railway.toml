# Railway config: API + webapp + chatapp (all-in-one)
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "RAILPACK"
buildCommand = "python -m src.apps.webapp && python -m src.apps.chatapp"
watchPatterns = ["/src/**"]
[deploy]
startCommand = "python -m src.apps.server"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
