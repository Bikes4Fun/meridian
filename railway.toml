# Railway config: API + webapp + chatapp (all-in-one)
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "RAILPACK"
buildCommand = "cd src && python main.py --railway-run"
watchPatterns = ["/src/**"]

[deploy]
startCommand = "s"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
