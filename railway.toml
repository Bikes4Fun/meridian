# Railway config: API + webapp + chatapp (all-in-one)
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "RAILPACK"
buildCommand = "python -m src.apps.webapp && python -m src.apps.chatapp"
watchPatterns = ["/src/**"]
[deploy]
startCommand = "sh -lc 'python -m src.apps.server & API_URL=http://127.0.0.1:${PORT:-8000} python -m src.dev.demo.seed || true; wait'"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
