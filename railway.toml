# Railway config: API + webapp (all-in-one)
# Docs: https://docs.railway.com/reference/config-as-code
#
# Service variables (set in Railway UI -> service -> Variables, not in this file):
# MERIDIAN_DEMO_SEED=1 - run demo seed after deploy (see apps.server __main__)

[build]
builder = "RAILPACK"
buildCommand = "PYTHONPATH=src python -m apps.webapp"
watchPatterns = ["/src/**"]
[deploy]
startCommand = "PYTHONPATH=src python -m apps.server serve"
healthcheckPath = "/api/health"
restartPolicyType = "ON_FAILURE"
