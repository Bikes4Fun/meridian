<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Family Chat</title>
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <h1 id="chatHeader">Family Chat</h1>
    <p id="chatParticipants"><span id="youLabel">You</span>: <span id="youName">…</span> · <span id="themLabel">Chatting with</span>: <span id="themName">…</span></p>
    <div id="status" class="info">Loading…</div>
    <div id="callStatus" class="info" style="display: none;"></div>
    <div id="callRow" style="display: none;">
        <button type="button" id="startVideoCallBtn">Start video call</button>
        <button type="button" id="endCallBtn" disabled>End call</button>
    </div>
    <div id="callVideos" style="display: none;">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
    <div id="messages"></div>
    <div id="sendRow" style="display: none;">
        <input type="text" id="msgInput" placeholder="Type a message…">
        <button type="button" id="sendBtn">Send</button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sendbird-calls@1.12.2/SendBirdCall.min.js"></script>
    <script src="chat.js"></script>
</body>
</html>
