<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Chat</title>
    <style>
        @font-face {
            font-family: 'Atkinson Hyperlegible';
            src: url('/fonts/AtkinsonHyperlegible-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Atkinson Hyperlegible';
            src: url('/fonts/AtkinsonHyperlegible-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        body { font-family: 'Atkinson Hyperlegible', Arial, sans-serif; font-size: 16px; line-height: 1.6; max-width: 600px; margin: 20px auto; padding: 16px; }
        h1 { font-size: 32px; font-weight: 700; color: #333; }
        #status { margin: 12px 0; padding: 10px; border-radius: 8px; font-size: 14px; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .success { background: #d4edda; color: #155724; }
        #messages { border: 1px solid #ddd; border-radius: 8px; height: 280px; overflow-y: auto; padding: 12px; margin: 12px 0; background: #fafafa; }
        #messages p { margin: 6px 0; font-size: 14px; line-height: 1.6; }
        #sendRow { display: flex; gap: 8px; margin-top: 8px; }
        #msgInput { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        #sendBtn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        #sendBtn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1 id="chatHeader">Family Chat</h1>
    <p id="chatParticipants"><span id="youLabel">You</span>: <span id="youName">…</span> · <span id="themLabel">Chatting with</span>: <span id="themName">…</span></p>
    <div id="status" class="info">Loading…</div>
    <div id="messages"></div>
    <div id="sendRow" style="display: none;">
        <input type="text" id="msgInput" placeholder="Type a message…">
        <button type="button" id="sendBtn">Send</button>
    </div>
    <script src="chat.js"></script>
</body>
</html>
