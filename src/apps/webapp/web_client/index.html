<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Check-In</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="pending">
    <div id="appPending">Checking session…</div>
    <div id="appContent">
    <nav id="appNav" class="app-nav">
        <button type="button" class="nav-btn active" data-page="checkin">Check-In</button>
        <button type="button" class="nav-btn" data-page="events">Events</button>
        <button type="button" class="nav-btn" data-page="medications">Medications</button>
        <button type="button" class="nav-btn" data-page="alert">Alert</button>
    </nav>
    <div id="pageCheckin" class="page active">
    <div id="chatSection">
        <h2>Chat</h2>
        <p style="font-size: 14px; color: #666;">Choose a contact to chat with. Opens in a separate window.</p>
        <div id="contactsSection">
            <div id="contactsGrid"></div>
        </div>
        <p id="openChatStatus"></p>
        <div id="messages"></div>
        <div id="chatSendRow">
            <input type="text" id="chatMsgInput" placeholder="Type a message…">
            <button type="button" id="chatSendBtn">Send</button>
        </div>
    </div>

    <h1>📍 Family Check-In</h1>
    <p style="font-size: 14px; color: #666;"><a href="/login.html">Log in</a> · <a href="#" id="logoutLink" style="display: none;">Log out</a></p>
    
    <select id="familyMemberSelect">
        <option value="">-- Select who to check in --</option>
    </select>
    
    <input type="text" id="notes" placeholder="Details / Notes (optional, e.g. note for family)">
    
    <button id="checkinBtn" type="button">Check In Now</button>
    </div>
    <div id="pageEvents" class="page"></div>
    <div id="pageMedications" class="page"></div>
    <div id="pageAlert" class="page">
    <h2>Alert TV</h2>
    <p style="color: #666; font-size: 14px;">Force the TV to show the emergency screen with flashing border.</p>
    <button id="alertBtn" type="button">Alert Mode</button>
    <button id="cancelAlertBtn" type="button">Cancel Alert</button>
    </div>

    <div id="status"></div>
    </div>

    <script src="/events.js"></script>
    <script src="/medications.js"></script>
    <script src="/app.js"></script>
</body>
</html>
