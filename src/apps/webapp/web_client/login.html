<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="/shared/css/base.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
    <h1>Log In</h1>
    <p class="login-subtitle">Select user and family circle (simulated login for demo).</p>
    <form id="loginForm">
        <label for="familyCircleId">Family Circle ID</label>
        <input type="text" id="familyCircleId" value="F00000" required placeholder="e.g. F00000">

        <label for="userId">User ID</label>
        <input type="text" id="userId" value="fm_002" required placeholder="e.g. fm_005">

        <button type="submit">Continue</button>
    </form>
    <script src="/app.js"></script>
</body>
</html>
