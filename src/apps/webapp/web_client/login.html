<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian · Log in</title>
    <link rel="stylesheet" href="/shared/base.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page app-dashboard">
    <div class="login-brand">
        <img src="/brand/logo-mark.png" alt="" class="login-logo-mark" width="56" height="56" decoding="async">
        <div class="login-brand-text">
            <span class="login-product-name">Meridian</span>
            <h1>Log in</h1>
        </div>
    </div>
    <p class="login-subtitle">Select user and family circle (simulated login for demo).</p>
    <form id="loginForm">
        <label for="familyCircleId">Family Circle ID</label>
        <input type="text" id="familyCircleId" value="F00000" required placeholder="e.g. F00000">

        <label for="userId">User ID</label>
        <input type="text" id="userId" value="fm_002" required placeholder="e.g. fm_005">

        <button type="submit">Continue</button>
    </form>
    <script src="/meridian_api_base.js"></script>
    <script src="/app.js"></script>
</body>
</html>
