[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    unit: Unit tests that don't require database
    integration: Tests that require database connection
    remote: Tests that hit the live Railway API (opt-in: pytest -m remote)
    slow: Tests that take a long time to run
